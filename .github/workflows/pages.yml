name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # 仅用于失败时打印 Pages 部署状态（Dump Pages deployment statuses）。
  # 显式列 permissions 时其余作用域一律为 none，不写这条会 403。
  deployments: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install python-docx
        run: pip install python-docx

      # 结构一致性闸门：三语索引页同构、层级页面齐备、计数、sitemap、i18n、命名差异产物
      # （数据本身有错就不部署；生成产物由下面的步骤重新生成，不在此处比较）
      - name: Structural checks before build
        run: python _tools/check_site.py

      - name: Convert _inbox to posts
        run: python .github/workflows/convert_inbox.py

      # 分类层级 / 科亚科正文 / 索引页说明块三项数据自洽（只校验 JSON，不读 list.md）
      - name: Verify taxonomy data files
        run: python _tools/extract_taxon_data.py --check

      # 三语 /list/ 索引页 + 英西译文页（/en/list/sections/、/es/list/sections/）：
      # 从 _data/taxonomy.json + list_index_blocks.json + taxon_prose.json 生成
      - name: Build list index pages
        run: python _tools/build_list_index.py

      # 分类树结构化数据（isoptera-data.json / data/）与三语统计页（stats.md）：
      # 从 _data/taxonomy.json + _species/ 确定性生成；必须在物种页正文与数据集之前跑
      - name: Build taxonomy data and statistics pages
        run: python _tools/build_taxonomy_data.py --write

      - name: Build genus index for species pages
        run: python .github/workflows/build_genus_index.py

      - name: Build species page bodies
        run: python .github/workflows/build_species_body.py --write

      # 「全部图片」页（/species/<slug>/photos/、/genus/<id>/photos/ 等）与
      # _data/photo_taxa.json（哪些分类单元有照片）：从 _data/species_photos.json 确定性生成。
      # 必须在 build_taxonomy_pages.py 之前跑——科/亚科/属页会按 photo_taxa.json 决定
      # 要不要挂图片小节、front matter 写不写 has_photos。
      - name: Build /photos/ pages for taxa with photos
        run: python .github/workflows/build_photo_pages.py

      # 科／亚科／属聚合页（/family/、/subfamily/、/genus/）：从 _species front matter 确定性生成
      - name: Build family / subfamily / genus hub pages
        run: python .github/workflows/build_taxonomy_pages.py

      # 三语分页自检：zh / en / es 三份页面齐备、各自单语、站内链接带语言前缀。
      # 放在分类页与物种页都生成之后、Jekyll 之前——一旦某语言漏页或混语，这里先红，
      # 不用等整站构建完再在线上发现 404。
      - name: Check three-language pages (zh / en / es)
        run: python _tools/check_lang_pages.py --ci

      - name: Build sitemap.txt
        run: python .github/workflows/build_sitemap_txt.py

      # 命名差异看板数据（/list/name-issues/）：从 GBIF / COL / BSF 缓存整理，确定性输出
      - name: Build name-issues dashboard data
        run: python .github/workflows/build_name_issues.py --write

      # 版本记录（/changelog/ 三语 + changelog.atom）：_data/changelog.json 与 Atom feed
      # 都由 dataset/CHANGELOG.md 生成，确定性输出（不含时间戳）；
      # validate.yml 会重跑同一脚本并用 git status 断言产物已提交，所以这里漏跑会立刻红
      - name: Build changelog data and Atom feed
        run: python _tools/build_changelog.py --write

      # 拼音 / 繁体是可选增强：装不上时 build_search_index.py 会自动跳过，不阻断部署
      - name: Install search index libraries (pinyin / traditional Chinese)
        continue-on-error: true
        run: pip install pypinyin opencc-python-reimplemented

      - name: Build search index (adds pinyin and traditional Chinese fields)
        run: python .github/workflows/build_search_index.py --write

      - name: Build dataset package (DOI export)
        run: python .github/workflows/build_dataset.py --write

      # ------------------------------------------------------------------
      # 外部数据与增强产物的校验（离线；损坏的 JSON 在这里就暴露，但不阻断部署）。
      # 数据缓存随仓库提交，因此构建不需要现场抓 3000+ 次 API；刷新方式见各 _tools/*.md：
      #   python .github/workflows/build_authority_links.py --write   （GBIF / Catalogue of Life / Wikidata）
      #   python .github/workflows/build_bsf_links.py --write         （Blattodea Species File 半自动对照）
      #   python .github/workflows/build_species_photos.py --write    （iNaturalist + Wikimedia Commons 图片）
      #   python .github/workflows/build_references.py --write        （Crossref 文献增强）
      #   python .github/workflows/build_papers.py --write             （/papers/ 属级文献缓存 + 摘要）
      #   python .github/workflows/build_occurrence_geojson.py --write（GBIF 分布图）
      # ------------------------------------------------------------------
      # 离线校验：坏了就应当阻断部署（线上只剩排版错误比缺数据更糟）。
      # 注意：网络类步骤（权威库增量刷新 / Pagefind 安装与索引）仍保留 continue-on-error。
      - name: Verify external data caches (offline)
        run: |
          python .github/workflows/build_authority_links.py --check
          python .github/workflows/build_bsf_links.py --check
          python .github/workflows/build_species_photos.py --check
          python .github/workflows/build_photo_pages.py --check
          python .github/workflows/build_references.py --verify
          python .github/workflows/build_papers.py --check
          # GeoJSON 与索引必须一一对应：既校验 JSON 合法，也防止孤儿/缺失文件。
          # 索引 = _data/occurrence_summary.json（科 / 属 / 种）+ _data/subfamily_maps.json（亚科，
          # 由 build_taxonomy_pages.py 合并属级网格生成）。实现在 _tools/check_geo.py，
          # 与 _tools/check_site.py 共用同一份逻辑——不要在 YAML 里再内联一份（加亚科时就是
          # 因为内联版只认 occurrence_summary.json，把 15 个亚科地图全判成孤儿，部署假红）。
          python _tools/check_geo.py

      # 构建时增量刷新外部权威库：只用已提交缓存 + 过期条目，最多 120 秒；
      # 因此部署版可能比仓库缓存新，但绝不让构建因外部 API 变慢/失败而卡住。
      - name: Refresh authority links (budgeted, non-blocking)
        continue-on-error: true
        run: python .github/workflows/build_authority_links.py --write --refresh --stale-days 30 --budget 120

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Liquid 语法闸门：放在 Jekyll 之前，同一类错误在这里给出 file:line，
      # 而不是几分钟后的一条 Liquid Exception + Ruby 堆栈。
      - name: Lint Liquid templates before build
        run: python _tools/check_liquid.py

      # 静态资源缓存戳：按 assets/*.css|js 的内容写 _data/build.json，模板里的 ?v= 读它。
      # 必须在 Jekyll 之前跑——迟到一步，本次构建的 CSS/JS URL 就还是上一版指纹。
      - name: Stamp static asset versions from file content
        run: python _tools/stamp_assets.py

      # DwC-A 是提交进仓库的派生产物（dataset/dwca/ 与 downloads/*-dwca.zip）。
      # 部署前断言它与 taxonomy/synonyms 源一致，避免把过期归档包发上线；
      # 完整的重建由 validate.yml 的 regen_all 兜底。
      - name: Check Darwin Core Archive is current
        run: python _tools/build_dwca.py --check

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # actions/jekyll-build-pages 在 Docker 容器里构建，_site 归 root 所有；
      # 紧接着的 Pagefind 以 runner 身份写 _site/pagefind 会 panic
      #（thread 'main' panicked at pagefind/src/output/mod.rs: Os error 13 PermissionDenied）。
      - name: Fix _site ownership (Jekyll runs in Docker as root)
        run: sudo chown -R "$(id -u):$(id -g)" _site

      # 发布面守卫：Jekyll 会把仓库根目录的一切（除 _ / . 开头）复制进 _site，
      # 历史上就漏过 build 日志、4.3MB 出版社 PDF 和未发表书稿。_config.yml 的 exclude
      # 挡住已知的那几样，这里再断言一次，避免下一次误放进来的东西悄悄上线。
      - name: Guard published surface (no draft/manuscript/log files)
        run: python _tools/check_publish_surface.py _site

      # 全站全文检索：Pagefind 在 Jekyll 产物上生成静态索引 /pagefind/
      # extended 版才带中文 / 日文分词支持，务必装 [extended] 额外包。
      - name: "Install Pagefind (extended: Chinese tokenizer)"
        continue-on-error: true
        run: pip install "pagefind[extended]==1.5.2"

      # 全文检索索引失败时不阻断发布：搜索页会显示「索引尚未生成」的回退提示
      - name: Index site with Pagefind
        continue-on-error: true
        run: python -m pagefind --site _site

      - name: Verify Pagefind bundle
        run: |
          if test -f _site/pagefind/pagefind.js && test -f _site/pagefind/pagefind-ui.js; then
            echo "Pagefind bundle OK: $(du -sh _site/pagefind | cut -f1)"
          else
            echo "::warning::Pagefind bundle missing — full-text search page will show its fallback"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # 2026-11-03 事故：Pages 后端把部署卡在 updating_pages，超过 deploy-pages 自带的
    # timeout（默认 600000 ms = 10 分钟）后被 abort，同一 sha 连续两次 attempt 都是 10 分钟整
    # 挂死（run 41669679212 attempt 1/2，deployment 7523872615 / 7524597129）。
    # 把等待窗口放宽到 30 分钟：既给「后端只是慢」留出余量，也能把「慢」和「真卡死」区分开
    # ——若 30 分钟仍未收敛，就不要再加时长，直接改用 gh-pages 分支发布或找 GitHub Support。
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000

      # 失败时把 Pages 部署状态打出来：日志里只会说 "Timeout reached"，而到底卡在哪个
      # deployment、状态是什么，只能从这里看。continue-on-error 保证它不掩盖真正的失败。
      - name: Dump Pages deployment statuses (diagnostics)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="${{ github.api_url }}/repos/${{ github.repository }}/deployments"
          echo "== recent github-pages deployments"
          gh api "$api?environment=github-pages&per_page=5" \
            --jq '.[] | "\(.id) \(.sha[0:8]) \(.created_at)"' || true
          for id in $(gh api "$api?environment=github-pages&per_page=3" --jq '.[].id'); do
            echo "== deployment $id"
            gh api "$api/$id/statuses" --jq '.[] | "\(.state) \(.created_at)"' || true
          done

  # 部署后线上抽检：状态码 200 + 关键内容。任一失败让工作流变红
  # （部署"成功"但页面缺失 / 错版 / 静态产物没上传时，这里会立刻发现）。
  verify:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 只跑标准库脚本，但显式装 Python 保证 python 命令存在（与其它 job 一致）
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify deployed URLs (status 200 and key content)
        run: |
          python - <<'PY'
          import sys
          import time
          import urllib.error
          import urllib.request

          # 站点前缀用仓库固定的 base_url（_config.yml 里写死，不依赖 deploy 输出）
          BASE = "https://termite-extant-isoptera.org"

          # (路径, 必须出现的片段)；片段为 None 表示只校验状态码
          CHECKS = [
              ("/", None),
              ("/list/", None),
              ("/species/mastotermes-darwiniensis/", "Mastotermes darwiniensis"),
              ("/search/", None),
              ("/sitemap.xml", None),
              ("/search-index.json", None),
              ("/data/index.json", None),
              ("/pagefind/pagefind.js", None),
              ("/feed.xml", None),
              ("/feed.json", None),
              ("/opensearch.xml", None),
              ("/changelog.atom", None),
              ("/changelog/", "2026.10.30"),
              ("/list/name-issues/", "ni-row"),
              ("/family/termitidae/", "TERMITIDAE"),
              ("/subfamily/macrotermitinae/", "Macrotermitinae"),
              ("/genus/mastotermes/", "Mastotermes darwiniensis"),
          ]
          UA = {"User-Agent": "isoptera-site-verify/1.0 (GitHub Actions deploy check)"}


          def fetch(url, attempts=6, delay=15):
              """CDN 传播有延迟：非 200 时重试；最终仍失败返回 (None, 原因)，
              不抛异常——否则第一个坏 URL 会遮住后面所有检查结果。"""
              last = ""
              for i in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers=UA)
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          return resp.status, resp.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as exc:
                      last = "HTTP %s" % exc.code
                  except Exception as exc:  # 网络抖动 / 超时
                      last = "%s: %s" % (type(exc).__name__, exc)
                  if i + 1 < attempts:
                      time.sleep(delay)
              return None, last


          failed = []
          for path, needle in CHECKS:
              url = BASE + path
              status, body = fetch(url)
              ok = status == 200 and (needle is None or needle in body)
              note = ""
              if not ok:
                  note = "  <- " + (body if status is None else "缺少关键内容 %r" % (needle,))
              print(("OK   " if ok else "FAIL ") + ("%s " % status if status else "") + url + note)
              if not ok:
                  failed.append(url)

          # 域名迁移护栏（2026-11-12 换域名的核心承诺）：旧 github.io 项目子路径必须
          # 301 到新域名的同一路径。GitHub Pages 在 Settings → Pages 里填了 Custom domain
          # 之后才会这样回 301；哪天这条变红，就是 GitHub 侧行为变了或自定义域名被清掉了。
          OLD_BASE = (
              "https://bennetgreen-bilibili.github.io"
              "/-Extant-Isoptera-Latin-Name-Chinese-Name-Comparison-List.md"
          )
          REDIRECT_PATHS = ["/", "/list/", "/species/mastotermes-darwiniensis/", "/en/list/"]


          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              """不让 urllib 自己跟 301，否则看不到 Location。"""

              def redirect_request(self, *args, **kwargs):
                  return None


          plain = urllib.request.build_opener(_NoRedirect)
          for path in REDIRECT_PATHS:
              src = OLD_BASE + path
              want = BASE + path
              code = None
              where = ""
              try:
                  plain.open(urllib.request.Request(src, headers=UA), timeout=60)
              except urllib.error.HTTPError as exc:
                  code = exc.code
                  where = (exc.headers.get("Location") or "").strip()
              except Exception as exc:  # noqa: BLE001 - 网络抖动当作失败，但别炸掉整个 job
                  where = "%s: %s" % (type(exc).__name__, exc)
              ok = code in (301, 308) and where.rstrip("/") == want.rstrip("/")
              print(("OK   " if ok else "FAIL ") + ("%s " % code if code else "") + src + "  ->  " + where)
              if not ok:
                  failed.append(src)

          if failed:
              print("::error::%d 个线上 URL 未通过校验：%s" % (len(failed), " ".join(failed)))
              sys.exit(1)
          print("线上校验通过：%d 个 URL（状态码 200 + 关键内容）+ %d 条旧域名 301"
                % (len(CHECKS), len(REDIRECT_PATHS)))
          PY

  indexnow:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Submit changed URLs to IndexNow (Bing/Yandex/Seznam/Naver)
        continue-on-error: true
        run: python .github/workflows/indexnow.py --changed