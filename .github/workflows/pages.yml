name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-docx
        run: pip install python-docx

      - name: Convert _inbox to posts
        run: python .github/workflows/convert_inbox.py

      - name: Build genus index for species pages
        run: python .github/workflows/build_genus_index.py

      - name: Build species page bodies
        run: python .github/workflows/build_species_body.py --write

      - name: Build sitemap.txt
        run: python .github/workflows/build_sitemap_txt.py

      - name: Build dataset package (DOI export)
        run: python .github/workflows/build_dataset.py --write

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Submit changed URLs to IndexNow (Bing/Yandex/Seznam/Naver)
        continue-on-error: true
        run: python .github/workflows/indexnow.py --changed
