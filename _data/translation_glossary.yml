# 文献检索器 · 摘要翻译术语表（只用于中文 ↔ 英文互译）
#
# 维护说明：
#   - 只影响「中英互译」。西班牙语目标不做术语干预（仍为纯机器翻译）。
#   - mask：翻译前把源语言术语替换成 [[n]] 占位符，译完还原成目标语言标准译名。
#           只放「多词 / 罕见 / 无歧义」的词；常用普通词请放 post_zh，否则会破坏句法。
#   - post_zh：只在中文译文里做「高频错误译法 → 标准术语」替换，不改原文；
#           when / unless 用原文（英文）词判定，避免误伤其他语境。
#   - 学名（3428 条拉丁名⇄中文正名）由名录自动生成，不在此文件重复；这里只补名录没有的名称。
#   - 改完内容请把 version +1：页面会用版本号重算译文缓存，旧译文自动失效。
#   - 形态/解剖术语按《中国白蚁志》等常用译法统一，供人工复核。
version: 3

