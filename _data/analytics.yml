# 访问统计（可选）：GoatCounter —— 开源、无 Cookie、不收集个人数据的网站统计
#
# 已按 goatcounter.com 给出的官方片段接入（站点代码 bennetgreen，统计面板
# https://bennetgreen.goatcounter.com）。三个字段对应官方片段里的三个值：
#
#   <script data-goatcounter="https://bennetgreen.goatcounter.com/count"
#           async src="//gc.zgo.at/count.js"></script>
#
# 想停用统计：把 count_url 置空（count_url: ""），页面就不会再输出任何统计脚本。
#
# 自托管：count_url 改成 https://<自己的域名>/count，script_src 改成
# https://<自己的域名>/count.js（或用反向代理指向 gc.zgo.at/count.js）。
goatcounter:
  # 计数接口（官方片段的 data-goatcounter）
  count_url: "https://bennetgreen.goatcounter.com/count"
  # 脚本地址（官方片段用 //gc.zgo.at/count.js，这里写成 https 明确协议）
  script_src: "https://gc.zgo.at/count.js"
  # 是否把本地预览（jekyll serve / localhost）的访问也算进统计；默认 false，线上不受影响
  count_local: false
