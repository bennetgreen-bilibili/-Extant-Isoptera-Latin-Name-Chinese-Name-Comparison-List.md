# Cloudflare AI Search（search.ai.cloudflare.com）接入配置。
#
# 索引由 Cloudflare 的爬虫按 termite-extant-isoptera.org 的 sitemap 抓取页面建立；
# 检索请求由访客浏览器直接发到 api_url（不经过本站服务器、不经过 GitHub Pages）。
# 前端代码见 assets/ai-search.js，入口文案见 _data/i18n.yml 的 search_ai_* 键。
#
# 停用：把 api_url 留空（api_url: ""）——模板（_layouts/default.html、
# _includes/ai-search-block.html）会连脚本、按钮、说明块一起不输出，页面不留死按钮。
api_url: "https://2804ca2a-1c83-41f9-9206-fc8b948772f6.search.ai.cloudflare.com"

# 官方 search-modal-snippet 自定义元素的 ESM 入口（v0.0.25）。Cloudflare 发新版时
# 改这里的版本号即可；脚本只在访客第一次点「AI 搜索」时才加载，首屏不请求第三方。
script_src: "https://2804ca2a-1c83-41f9-9206-fc8b948772f6.search.ai.cloudflare.com/assets/v0.0.25/search-snippet.es.js"

# 单次检索返回条数上限（官方弹窗默认 10，服务端最多按 30 取再截断）。
max_results: 10
