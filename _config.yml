# 站点标题：title 为双语合并串（供取 site.title 的场合：分享卡片、外部工具），
# title_zh / title_en / title_es 由 _layouts/default.html 的页头双语标题分两行渲染
# （主行=页面语言，副行=另一语言）；标签页标题只取各页 front matter 的 title。
title: "现存等翅下目（白蚁）拉丁学名—中文正名对照名录 | Extant Isoptera (Termites) — Latin–Chinese Name Comparison List"
title_zh: 现存等翅下目（白蚁）拉丁学名—中文正名对照名录
title_en: Extant Isoptera (Termites) — Latin–Chinese Name Comparison List
title_es: Isópteros actuales (termitas) — lista comparativa de nombres latinos y chinos
description: >-
  双语（中文/English）
  现存等翅下目（白蚁）现生类群对照名录：13 科、18 亚科、323 属、3008 种、63 亚种。
  提供名录检索、各阶元物种数统计，并按类群拆分的结构化数据（JSON-LD）。
lang: zh-CN
author: 班奈特格林
# Jekyll 标准站点地址：canonical、sitemap.xml、以及所有绝对链接都由 url + baseurl 拼接。
# 显式写死，避免依赖 GitHub Pages 构建时的自动注入（换域名/换构建方式时不会静默失效）。
url: https://bennetgreen-bilibili.github.io
baseurl: /-Extant-Isoptera-Latin-Name-Chinese-Name-Comparison-List.md

# 站内模板自用的自定义变量：{{ site.base_url }} 在 _layouts、list.md、物种页里共 6000+ 处，
# 值等于上面的 url + baseurl；改名会全站断链，改动时务必与上面保持同步。
base_url: https://bennetgreen-bilibili.github.io/-Extant-Isoptera-Latin-Name-Chinese-Name-Comparison-List.md

collections:
  species:
    output: true
    permalink: /species/:name/

defaults:
  -
    scope:
      path: "_posts"
    values:
      layout: post
      author: 班奈特格林
      lang: zh-CN
      permalink: /blog/:year/:month/:day/:slug/
  -
    scope:
      path: ""
      type: "species"
    values:
      layout: species
      lang: zh-CN
      author: 班奈特格林
  # ---------------------------------------------------------------------------
  # sitemap.xml 收录范围（与 sitemap.txt 对齐）
  # GitHub Pages 的默认插件会把「没有 front matter 的 Markdown / HTML」也渲染成页面
  # （jekyll-optional-front-matter），并把 README.md 当作目录索引页（jekyll-readme-index）；
  # 这些工具页/说明页于是被 jekyll-sitemap 收进 sitemap.xml，而 build_sitemap_txt.py
  # 只认带 front matter 的 .md，生成的 sitemap.txt 本来就不含它们。
  # 这里统一打 sitemap: false，避免两种格式不一致、以及 GSC 里出现无意义条目。
  # 注意：不能用 exclude —— 那会让页面本身 404（dataset/ 页面站内仍有链接）。
  # ---------------------------------------------------------------------------
  -
    scope:
      path: "dataset"
    values:
      sitemap: false
  -
    scope:
      path: "assets/vendor/leaflet"
    values:
      sitemap: false
  -
    scope:
      path: "googleb89ba243d635e504.html"
    values:
      sitemap: false
  -
    scope:
      path: "现存等翅下目 Extant Isoptera（白蚁领科）拉丁学名 — 中文正名对照名录Latin Name — Chinese Name Comparison List.md"
    values:
      sitemap: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# ---------------------------------------------------------------------------
# 数据集归档（DOI）
# 铸造 DOI 后只改这里的 doi / concept_doi，站内引用信息、JSON-LD identifier、
# 页面 <link rel="cite-as"> 会自动出现；不再需要手改页面。
# 归档包由 .github/workflows/build_dataset.py 生成（dataset/ 目录 + downloads/ 下的 zip），
# 完整流程见 _tools/数据集DOI与归档发布指南.md。
# ---------------------------------------------------------------------------
dataset:
  doi: "10.5281/zenodo.23646836"            # 版本 DOI（2026.10.17 已发布；2026.10.30 版待 Zenodo「New version」后回填）
  concept_doi: "10.5281/zenodo.23646835"    # 概念 DOI（全部版本）
  version: "2026.10.30"
  publisher: "Zenodo"
  license_name: "CC BY 4.0"
  license_url: "https://creativecommons.org/licenses/by/4.0/"
  archive_file: "downloads/isoptera-checklist-v2026.10.30.zip"  # 与 build_dataset.py 输出一致

# ---------------------------------------------------------------------------
# 外部权威库（物种页「其他数据库」外链 + JSON-LD sameAs）
# 只生成链接与一致性提示，不参与站内分类数据的生成或改写。
# 数据缓存：_data/authority_links.json（build_authority_links.py）
#           _data/bsf_links.json（build_bsf_links.py，世界名录 Blattodea Species File 半自动对照）
# 换 Catalogue of Life 年度版本时：改下面 col_taxon，并同步 build_authority_links.py 的 COL_DATASET。
# ---------------------------------------------------------------------------
external:
  gbif_home: "https://www.gbif.org"
  gbif_species: "https://www.gbif.org/species"                    # + /<GBIF usageKey>
  col_home: "https://www.catalogueoflife.org"
  col_taxon: "https://www.checklistbank.org/dataset/3LR/taxon"     # + /<COL usage id>
  wikidata: "https://www.wikidata.org/wiki"                       # + /<QID>
  bsf_home: "https://cockroach.speciesfile.org"
  bsf_otu: "https://cockroach.speciesfile.org/otus"               # + /<OTU id>/overview
  inaturalist: "https://www.inaturalist.org"
  commons: "https://commons.wikimedia.org"
