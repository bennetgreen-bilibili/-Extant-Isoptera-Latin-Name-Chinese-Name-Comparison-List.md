# 站点标题 = 品牌名 + 定位语（白蚁名录｜现生等翅下目）。2026-11-16 由原「拉丁学名—中文正名对照名录」
# 全名改为品牌式短名：全名只作数据集正式名（CITATION.cff / dataset/），页头与标签页用品牌名。
# title 为双语合并串（供取 site.title 的场合：分享卡片、外部工具），
# title_zh / title_en / title_es 由 _layouts/default.html 的页头双语标题分两行渲染
# （主行=页面语言，副行=另一语言）；标签页标题只取各页 front matter 的 title，
# 首页的 front matter title 比站名更长尾（带「分类·学名·中文名·分布」），站名本身只作品牌与页头 H1。
title: "白蚁名录 — 现生等翅下目 | Termite Checklist — Extant Isoptera"
title_zh: 白蚁名录 — 现生等翅下目
title_en: Termite Checklist — Extant Isoptera
title_es: Lista de termitas — Isópteros actuales
description: >-
  双语（中文/English）
  现存等翅下目（白蚁）现生类群对照名录：13 科、18 亚科、326 属、3021 种、68 亚种。
  提供名录检索、各阶元物种数统计，并按类群拆分的结构化数据（JSON-LD）。
# 各语言兜底 meta description（150–160 字，Bing 建议的描述长度）。
# 只有既没有手写 description、也不是物种页/文章页的页面才会用到（见 _includes/meta-description.html）。
# 上面那段 description 仍保持原样：feed.xml 用 description 作 <subtitle>，请不要改动它。
description_zh: "白蚁名录：收录现生白蚁 13 科、18 亚科、326 属、3021 种、68 亚种，可按拉丁学名、中文正名、异名、拼音与分布检索；含科、亚科、属、种四级页面，形态检索表、词源、模式产地与分布地图，文献可导出 GB/T 7714、BibTeX，另有 JSON 数据集与中英西三语界面。"
description_en: "Termite Checklist: 3,021 extant termite species and 68 subspecies in 13 families — Latin and Chinese names, distribution, identification keys and open data."
description_es: "Lista de termitas: 3.021 especies y 68 subespecies actuales de isópteros en 13 familias, con nombres latinos y chinos, distribución, claves y datos abiertos."
lang: zh-CN
author: 班奈特格林
# Jekyll 标准站点地址：canonical、sitemap.xml、以及所有绝对链接都由 url + baseurl 拼接。
# 显式写死，避免依赖 GitHub Pages 构建时的自动注入（换域名/换构建方式时不会静默失效）。
# 2026-11-12 起站点迁到自己的域名（Cloudflare DNS + GitHub Pages 自定义域名），
# 站点位于域名根，故 baseurl 为空；空值必须写成 ""（两个引号），
# _tools/build_sitemap_txt.py 与 _tools/build_taxonomy_data.py 读这两行时要求冒号后有内容。
url: https://termite-extant-isoptera.org
baseurl: ""

# 站内模板自用的自定义变量：{{ site.base_url }} 在 _layouts、list.md、物种页里共 6000+ 处，
# 值等于上面的 url + baseurl（baseurl 为空时就是 url，末尾不带斜杠）；改名会全站断链，
# 改动时务必与上面保持同步。_tools/check_site.py 会校验三者一致。
base_url: https://termite-extant-isoptera.org

collections:
  species:
    output: true
    permalink: /species/:name/

defaults:
  -
    scope:
      path: "_posts"
    values:
      layout: post
      author: 班奈特格林
      lang: zh-CN
      permalink: /blog/:year/:month/:day/:slug/
  -
    scope:
      path: ""
      type: "species"
    values:
      layout: species
      lang: zh-CN
      author: 班奈特格林
  -
    scope:
      path: ""
    values:
      # 全站统一的数据版本日期：sitemap.xml 的 <lastmod> 与结构化为 dateModified 用
      last_modified_at: 2026-10-30
  # ---------------------------------------------------------------------------
  # sitemap.xml 收录范围（与 sitemap.txt 对齐）
  # GitHub Pages 的默认插件会把「没有 front matter 的 Markdown / HTML」也渲染成页面
  # （jekyll-optional-front-matter），并把 README.md 当作目录索引页（jekyll-readme-index）；
  # 这些工具页/说明页于是被 jekyll-sitemap 收进 sitemap.xml，而 build_sitemap_txt.py
  # 只认带 front matter 的 .md，生成的 sitemap.txt 本来就不含它们。
  # 这里统一打 sitemap: false，避免两种格式不一致、以及 GSC 里出现无意义条目。
  # 注意：不能用 exclude —— 那会让页面本身 404（dataset/ 页面站内仍有链接）。
  # ---------------------------------------------------------------------------
  -
    scope:
      path: "dataset"
    values:
      sitemap: false
  -
    scope:
      path: "assets/vendor/leaflet"
    values:
      sitemap: false
  -
    scope:
      path: "googleb89ba243d635e504.html"
    values:
      sitemap: false
  -
    scope:
      path: "baidu_verify_codeva-02OUrzqDJS.html"
    values:
      sitemap: false
  # GitHub Pages 的 jekyll-optional-front-matter 会把没有 front matter 的 AGENTS.md 也渲染成
  # /AGENTS.html 并被 jekyll-sitemap 收录——那是仓库维护说明，不该出现在搜索结果里。
  -
    scope:
      path: "AGENTS.md"
    values:
      sitemap: false
  -
    scope:
      path: "现存等翅下目 Extant Isoptera（白蚁领科）拉丁学名 — 中文正名对照名录Latin Name — Chinese Name Comparison List.md"
    values:
      sitemap: false

# ---------------------------------------------------------------------------
# 发布面（_site）卫生：Jekyll 只跳过 _ 与 . 开头的文件，其余一律复制进 _site。
# 这里排除的是「不该被公开下载」的本地产物，与上面 defaults 里的 sitemap:false
# 不是一回事——sitemap:false 只是不进 sitemap.xml，文件照样发布；exclude 才真不发。
# 刻意不排除 dataset/（站内仍有链接，见上面第 68 行注释）。
# 注意：一旦写了 exclude，Jekyll 的内置默认排除表会被整份替换；本站根目录没有
# Gemfile / node_modules / vendor 这几样，所以只需要列出我们自己要挡的东西。
# ---------------------------------------------------------------------------
exclude:
  - "debug.log"
  - "prev_build_log.zip"
  - "d7a427cc5b8b4f029b3d6d7ec012d197.txt"
  - "s41467-024-51028-y.pdf"   # 出版社 PDF：全文在 _unpublished/文库/，仓库里不留原件
  - "undefined"
  - "nul"
  - "未发布内容"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# ---------------------------------------------------------------------------
# 数据集归档（DOI）
# 铸造 DOI 后只改这里的 doi / concept_doi，站内引用信息、JSON-LD identifier、
# 页面 <link rel="cite-as"> 会自动出现；不再需要手改页面。
# 归档包由 .github/workflows/build_dataset.py 生成（dataset/ 目录 + downloads/ 下的 zip），
# 完整流程见 _tools/数据集DOI与归档发布指南.md。
# ---------------------------------------------------------------------------
dataset:
  doi: "10.5281/zenodo.23646836"            # 版本 DOI（2026.10.17 已发布；2026.10.30 版待 Zenodo「New version」后回填）
  concept_doi: "10.5281/zenodo.23646835"    # 概念 DOI（全部版本）
  version: "2026.10.30"
  publisher: "Zenodo"
  license_name: "CC BY 4.0"
  license_url: "https://creativecommons.org/licenses/by/4.0/"
  archive_file: "downloads/isoptera-checklist-v2026.10.30.zip"  # 与 build_dataset.py 输出一致

# ---------------------------------------------------------------------------
# 外部权威库（物种页「其他数据库」外链 + JSON-LD sameAs）
# 只生成链接与一致性提示，不参与站内分类数据的生成或改写。
# 数据缓存：_data/authority_links.json（build_authority_links.py）
#           _data/bsf_links.json（build_bsf_links.py，世界名录 Blattodea Species File 半自动对照）
# 换 Catalogue of Life 年度版本时：改下面 col_taxon，并同步 build_authority_links.py 的 COL_DATASET。
# ---------------------------------------------------------------------------
external:
  gbif_home: "https://www.gbif.org"
  gbif_species: "https://www.gbif.org/species"                    # + /<GBIF usageKey>
  col_home: "https://www.catalogueoflife.org"
  col_taxon: "https://www.checklistbank.org/dataset/3LR/taxon"     # + /<COL usage id>
  wikidata: "https://www.wikidata.org/wiki"                       # + /<QID>
  bsf_home: "https://cockroach.speciesfile.org"
  bsf_otu: "https://cockroach.speciesfile.org/otus"               # + /<OTU id>/overview
  inaturalist: "https://www.inaturalist.org"
  commons: "https://commons.wikimedia.org"
